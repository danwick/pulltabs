<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <!-- Pull-tab lottery ticket -->
  <!-- Ticket body -->
  <rect x="2" y="4" width="20" height="16" rx="2" fill="#1E3A8A" stroke="#FFD700" stroke-width="1.5"/>
  <!-- Perforated pull tab area (top) -->
  <line x1="2" y1="9" x2="22" y2="9" stroke="#FFD700" stroke-width="1" stroke-dasharray="2 2"/>
  <!-- Tab pull indicator -->
  <path d="M10 6.5h4l-2 1.5-2-1.5z" fill="#FFD700"/>
  <!-- Prize window rows -->
  <rect x="5" y="12" width="4" height="2" rx="0.5" fill="#4C1D95"/>
  <rect x="10" y="12" width="4" height="2" rx="0.5" fill="#4C1D95"/>
  <rect x="15" y="12" width="4" height="2" rx="0.5" fill="#4C1D95"/>
  <rect x="5" y="16" width="4" height="2" rx="0.5" fill="#4C1D95"/>
  <rect x="10" y="16" width="4" height="2" rx="0.5" fill="#4C1D95"/>
  <rect x="15" y="16" width="4" height="2" rx="0.5" fill="#4C1D95"/>
</svg>
