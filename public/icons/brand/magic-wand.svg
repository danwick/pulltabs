<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <!-- Magic wand -->
  <!-- Wand body (diagonal) -->
  <rect x="3" y="18" width="18" height="3" rx="1" transform="rotate(-45 12 12)" fill="#1a1a1a"/>
  <!-- Gold tip -->
  <rect x="3" y="18" width="5" height="3" rx="1" transform="rotate(-45 12 12)" fill="#FFD700"/>
  <!-- Gold band -->
  <rect x="7" y="18" width="2" height="3" transform="rotate(-45 12 12)" fill="#FFD700"/>
  <!-- Sparkle at tip -->
  <circle cx="5" cy="5" r="1" fill="#FFD700"/>
  <circle cx="3" cy="7" r="0.5" fill="#60A5FA"/>
  <circle cx="7" cy="3" r="0.5" fill="#60A5FA"/>
</svg>
