  <text x="24" y="38" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="16" font-weight="bold" fill="#1976D2">$2</text>
  <!-- Pull tab window hints -->
  <rect x="14" y="48" width="8" height="6" rx="1" fill="white" opacity="0.4"/>
