  <!-- Perforated edge effect -->
  <circle cx="8" cy="20" r="2" fill="white" opacity="0.3"/>
  <circle cx="8" cy="32" r="2" fill="white" opacity="0.3"/>
  <circle cx="8" cy="44" r="2" fill="white" opacity="0.3"/>
  <circle cx="40" cy="20" r="2" fill="white" opacity="0.3"/>
  <circle cx="40" cy="32" r="2" fill="white" opacity="0.3"/>
  <circle cx="40" cy="44" r="2" fill="white" opacity="0.3"/>
  <!-- Price display -->
