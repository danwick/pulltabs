<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Blue background (matching 3Diamond brand) -->
  <rect width="64" height="64" rx="8" fill="#2851A3"/>
  <!-- Three outlined diamonds in a row -->
  <!-- Left diamond -->
  <path d="M11 32 L16 24 L21 32 L16 40 Z" fill="none" stroke="white" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M16 24 L11 32 M16 24 L21 32" stroke="white" stroke-width="0.75" opacity="0.6"/>
  <!-- Center diamond -->
  <path d="M27 32 L32 24 L37 32 L32 40 Z" fill="none" stroke="white" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M32 24 L27 32 M32 24 L37 32" stroke="white" stroke-width="0.75" opacity="0.6"/>
  <!-- Right diamond -->
  <path d="M43 32 L48 24 L53 32 L48 40 Z" fill="none" stroke="white" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M48 24 L43 32 M48 24 L53 32" stroke="white" stroke-width="0.75" opacity="0.6"/>
</svg>
